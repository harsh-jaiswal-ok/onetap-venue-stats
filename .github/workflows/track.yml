name: Track venue availability

# Runs 24/7 on GitHub's servers (no laptop needed). Polls each enabled venue's
# live availability, rebuilds the wasted-slot report and the site, and commits
# the updated data back to the repo.
on:
  schedule:
    - cron: "0 * * * *"      # hourly, on the hour (UTC)
  workflow_dispatch: {}       # ...and a manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: data-write           # shared with crawl.yml so the two never push at once
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Poll availability
        # To enable the Intrac tennis venues, add repo secrets and uncomment:
        #   CAMPERDOWN_INTRAC_USER / CAMPERDOWN_INTRAC_PASS / CCT_INTRAC_USER / CCT_INTRAC_PASS
        # env:
        #   CAMPERDOWN_INTRAC_USER: ${{ secrets.CAMPERDOWN_INTRAC_USER }}
        #   CAMPERDOWN_INTRAC_PASS: ${{ secrets.CAMPERDOWN_INTRAC_PASS }}
        run: python tracker.py --once

      - name: Rebuild report + site
        run: |
          python report.py
          python build_site.py

      - name: Commit updated data
        run: |
          git config user.name "onetap-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracking.db reports docs/index.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: tracking update $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          fi
