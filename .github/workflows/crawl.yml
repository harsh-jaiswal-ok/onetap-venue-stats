name: Weekly venue intelligence crawl

# Re-crawls the 10 venue websites once a week (booking platform, prices, hours,
# contacts) and rebuilds the site. Cheap and slow-changing, so weekly is plenty.
on:
  schedule:
    - cron: "0 20 * * 0"     # Sundays 20:00 UTC (~6am Mon Sydney)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Crawl venue websites
        run: python venue_report.py

      - name: Rebuild site
        run: python build_site.py

      - name: Commit updated data
        run: |
          git config user.name "onetap-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports docs/index.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: venue crawl $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            git push
          fi
