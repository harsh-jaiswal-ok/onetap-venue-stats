AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: OneTap wasted-slot tracker - scheduled availability polling to S3-hosted SQLite, plus an on-demand report.

Parameters:
  PollSchedule:
    Type: String
    Default: rate(30 minutes)
    Description: How often to poll venue availability.
  ReportSchedule:
    Type: String
    Default: cron(0 22 ? * * *)   # 22:00 UTC daily = ~8am Sydney; rebuilds the report each morning
    Description: When to rebuild the wasted-slot report.
  PollMinutes:
    Type: String
    Default: "30"
    Description: Passed to the tracker so lookahead/labelling matches the poll cadence.

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub onetap-tracker-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Public static-website bucket that serves the dashboard.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub onetap-site-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::onetap-site-${AWS::AccountId}/*

  # CloudFront in front of the S3 website bucket -> HTTPS with the free
  # *.cloudfront.net cert. Caching disabled so the 30-min dashboard rebuilds
  # show up immediately without invalidations.
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: OneTap dashboard HTTPS
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: SiteS3Website
            DomainName: !Sub onetap-site-${AWS::AccountId}.s3-website-${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: SiteS3Website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  TrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: onetap-tracker-poll
      Handler: tracker_lambda.handler
      Runtime: python3.13
      CodeUri: .
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          REPORT_BUCKET: !Sub onetap-tracker-${AWS::AccountId}
          SITE_BUCKET: !Sub onetap-site-${AWS::AccountId}
          DB_KEY: state/tracking.db
          POLL_MINUTES: !Ref PollMinutes
          # Add Intrac creds here (or in SSM/Secrets Manager) to enable tennis venues:
          # CAMPERDOWN_INTRAC_USER: ...
          # CAMPERDOWN_INTRAC_PASS: ...
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub onetap-tracker-${AWS::AccountId}
        - S3CrudPolicy:
            BucketName: !Sub onetap-site-${AWS::AccountId}
      Events:
        Poll:
          Type: Schedule
          Properties:
            Schedule: !Ref PollSchedule

  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: onetap-tracker-report
      Handler: report_lambda.handler
      Runtime: python3.13
      CodeUri: .
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          REPORT_BUCKET: !Sub onetap-tracker-${AWS::AccountId}
          DB_KEY: state/tracking.db
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub onetap-tracker-${AWS::AccountId}
      Events:
        DailyReport:
          Type: Schedule
          Properties:
            Schedule: !Ref ReportSchedule

Outputs:
  DataBucket:
    Value: !Ref DataBucket
  SiteURL:
    Description: Public dashboard URL (HTTP, S3 website)
    Value: !GetAtt SiteBucket.WebsiteURL
  SiteHttpsURL:
    Description: Public dashboard URL (HTTPS, via CloudFront)
    Value: !Sub https://${SiteDistribution.DomainName}
  TrackerFunction:
    Value: !Ref TrackerFunction
  ReportFunction:
    Value: !Ref ReportFunction
